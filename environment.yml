name: noising-probing
channels:
  - conda-forge
  - defaults
dependencies:
  - h5py
  - tqdm
  - pandas
  - python=3.12.9
  - scikit-learn
  - pip
  - pip:
    - torch --index-url https://download.pytorch.org/whl/rocm6.4 --force-reinstall
    - torchvision --index-url https://download.pytorch.org/whl/rocm6.4 --force-reinstall
